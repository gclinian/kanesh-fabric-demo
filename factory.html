<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工廠端 Endpoint · 互動原型</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="factory">

<div class="topbar" id="topbar"></div>

<div class="layout">
  <aside class="side"><nav class="nav" id="nav"></nav></aside>
  <main id="main"></main>
</div>

<div id="modal" class="mask hidden"><div class="modal" id="modalBody"></div></div>

<!-- i18n 先載(定義全域 t/getLang/toggleLang,factory-app.js 會用到) -->
<script src="assets/js/i18n.js"></script>

<!-- 三廠合一:用 ?stage=spin|weave|dye 決定載入哪一站設定。
     先載 stages/<id>.js(設定 window.STAGE / window.FIELDS),
     再載三廠共用的 factory-app.js(載入後自行 render())。 -->
<script>
(function(){
  var allowed = ['spin','weave','dye'];
  var stage = new URLSearchParams(location.search).get('stage') || 'spin';
  if (allowed.indexOf(stage) < 0) stage = 'spin';

  function fail(src){
    var m = document.getElementById('main');
    if (m) m.innerHTML = '<h1>載入失敗</h1><p>無法載入 <code>' + src +
      '</code>。請以 HTTP 伺服器開啟(例如 <code>npm run serve</code> → http://localhost:8000/factory.html?stage=' +
      stage + '),不要用 file:// 直接開。</p>';
  }
  function load(src, onload){
    var s = document.createElement('script');
    s.src = src; s.async = false;
    s.onload = onload || null;
    s.onerror = function(){ fail(src); };
    document.head.appendChild(s);
  }

  load('stages/' + stage + '.js', function(){
    if (window.STAGE && window.STAGE.titleZh) document.title = window.STAGE.titleZh;
    load('assets/js/factory-app.js');
  });
})();
</script>
</body>
</html>
