  ns:'dpp_demo:',
  get(k){try{const v=localStorage.getItem(this.ns+k);return v?JSON.parse(v):null;}catch(e){return null;}},

};
function simpleHash(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*0x01000193)>>>0;}return ('00000000'+h.toString(16)).slice(-8);}

const QR={ render(canvas,text,opts){ opts=opts||{}; try{
    const qr=qrcode(0,opts.ec||'M'); qr.addData(text); qr.make();
    const n=qr.getModuleCount(), scale=opts.scale||6, m=opts.margin==null?4:opts.margin, size=(n+m*2)*scale;
    canvas.width=size; canvas.height=size; const x=canvas.getContext('2d');
    x.fillStyle='#ffffff'; x.fillRect(0,0,size,size); x.fillStyle='#111111';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(qr.isDark(r,c)) x.fillRect((c+m)*scale,(r+m)*scale,scale,scale);
    return true;
  }catch(e){ return false; } } };

/* ===================== DPP metadata / 雜湊 / IPFS(沿用 DPP_NFT 方法) ===================== */
function stableStringify(value){
  if(Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
  if(value!==null && typeof value==='object'){
    return `{${Object.keys(value).sort().map(k=>`${JSON.stringify(k)}:${stableStringify(value[k])}`).join(',')}}`;
  }
  return JSON.stringify(value);
}
/* 由「工廠回傳的提交」組出 DPP metadata JSON(公開欄位明文,加密欄位放 demo 佔位) */
function buildStageMetadata(stage, sub, previousTokenId){
  const publicData={}, encryptedData={};
  const attributes=(sub.fields||[]).map(f=>{
    if(f.disclosure==='public'){ publicData[f.key]=f.val; return {trait_type:f.label,value:f.val,visibility:'public'}; }
    encryptedData[f.key]=`ENC(DEMO_ONLY:${f.key})`;
    return {trait_type:f.label,value:'Encrypted (demo placeholder)',visibility:'private'};
  });
  return {
    name:`Kanesh DPP ${ORDER.no} · ${stage.label}`,
    description:`Platform-issued Digital Product Passport for the ${stage.label} stage of order ${ORDER.no}.`,
    attributes,
    dpp:{
      schema:stage.schema, order:ORDER.no, stage:stage.id,
      previousTokenId:previousTokenId||0, factoryDid:stage.factoryDid,
      publicData, encryptedData, encryptionNotice:'DEMO_ONLY_NOT_REAL_ENCRYPTION'
    }
  };
}
function computeDPPHashes(metadata, stage){
  const canonicalJson=stableStringify(metadata);
  return {
    canonicalJson,
    metadataHash:ethers.keccak256(ethers.toUtf8Bytes(canonicalJson)),
    schemaHash:ethers.keccak256(ethers.toUtf8Bytes(stage.schema)),
    orderHash:ethers.keccak256(ethers.toUtf8Bytes(ORDER.no)),
    stage:ethers.keccak256(ethers.toUtf8Bytes(stage.id))
  };
}
async function uploadMetadataToIPFS(metadata){
  let response;
  try{
    response=await fetch(IPFS_UPLOAD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(metadata)});
  }catch(e){
    throw new Error(`無法連接本機 IPFS 上傳服務 (${IPFS_UPLOAD_ENDPOINT})。請先在專案根目錄執行 npm start。`);
  }
  let result=null; try{result=await response.json();}catch(_){}
  if(!response.ok) throw new Error(result?.error||`IPFS 上傳失敗 (HTTP ${response.status})。`);
  if(!result?.cid || !result?.tokenURI) throw new Error('IPFS 上傳服務未回傳有效的 CID / tokenURI。');
  return {cid:result.cid, tokenURI:result.tokenURI, gatewayURL:result.gatewayURL||null};
}

const walletState={account:null, chainId:null};
function isSepolia(){return walletState.chainId===SEPOLIA_CHAIN_ID;}
function walletErrorMessage(error, fallback){
  const m=error&&(error.info?.error?.message||error.shortMessage||error.message);
  return m?`${fallback}(${m})`:fallback;
}
async function connectWallet(){
  if(!window.ethereum){ const m=t('找不到 EVM 瀏覽器錢包。請安裝或啟用 MetaMask / OKX Wallet 後重試。','No EVM browser wallet found. Install or enable MetaMask / OKX Wallet and retry.'); alert(m); toast(m); return null; }
  try{
    const accounts=await window.ethereum.request({method:'eth_requestAccounts'});
    walletState.account=accounts?.[0]||null;
    const cid=await window.ethereum.request({method:'eth_chainId'});
    walletState.chainId=parseInt(cid,16);
    return walletState.account;
  }catch(error){ toast(walletErrorMessage(error,t('錢包連線失敗。','Wallet connection failed.'))); return null; }
}
async function switchToSepolia(){
  if(!window.ethereum) return false;
  try{
    await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:SEPOLIA_CHAIN_HEX}]});
    const cid=await window.ethereum.request({method:'eth_chainId'});
    walletState.chainId=parseInt(cid,16);
    return isSepolia();
  }catch(error){ toast(walletErrorMessage(error,t('無法切換到 Sepolia,請在錢包中手動切換後重試。','Could not switch to Sepolia; switch manually in your wallet and retry.'))); return false; }
}

function vDPP(){

  return dppPreview(ch);

function dppHashOf(ch){ return simpleHash(ch.map(s=>s.block.hash||s.block.metadataHash).join('|')+ch.map(s=>s.fields.filter(f=>f.disclosure==='public').map(f=>f.val).join(',')).join('|')); }
function dppPreview(ch){
  let pubTotal=0, priTotal=0;
  ch.forEach(s=>{pubTotal+=s.publicCount; priTotal+=s.privateCount;});
  const dh=dppHashOf(ch);
  const aud=state.audience;
  const isReg=aud==='regulator';
  const audLabel=isReg?t('法規機關','Regulator'):t('消費者','Consumer');
  // QR 內含 view=對象,使不同對象產生「不同的 QR」
  const url=`https://dpp.example/p/A2207?view=${aud}#${dh}`;
  /* 揭露規則(兩種對象):
     - 消費者:只看工廠選擇「公開」的欄位(明文)
     - 法規機關:可額外審閱工廠「加密上傳」的欄位(具解密權,看得到原始值) */
  const keyReqs=Bus.get('keyRequests')||[];
  const keyApproved=(stg,k)=>keyReqs.some(r=>r.stage===stg&&r.key===k&&r.status==='approved');
  let body='', visTotal=0, priApproved=0;
  ch.forEach(s=>{
    const cat=stageById(s.stage);
    const catVal=k=>{const c=cat&&cat.fields.find(x=>x.key===k);return c?fVal(c):t('(原始值)','(original value)');};
    const pubs=s.fields.filter(f=>f.disclosure==='public');
    const pris=s.fields.filter(f=>f.disclosure==='private');
    const apprPris=isReg?pris.filter(f=>keyApproved(s.stage,f.key)):[];
    priApproved += apprPris.length;
    visTotal += pubs.length + apprPris.length;
    const pubRows=pubs.map(f=>`<div class="attr"><span class="a-l">🌐 ${fLabel(f)}</span><span class="a-v">${fVal(f)}</span></div>`).join('');
    const regRows=isReg?pris.map(f=>keyApproved(s.stage,f.key)
      ?`<div class="attr"><span class="a-l" style="color:var(--jewel)">🔓 ${fLabel(f)} <span class="vis">${t('(已放行解密)','(released)')}</span></span><span class="a-v" style="color:var(--jewel)">${catVal(f.key)}</span></div>`
      :`<div class="attr"><span class="a-l">🔒 ${fLabel(f)} <span class="vis">${t('(待工廠放行)','(pending factory release)')}</span></span><span class="a-v vis">${t('向工廠申請鑰匙後可見','visible after requesting the key')}</span></div>`).join(''):'';
    body+=`<div class="bdcol pub"><h4>${cat?sBrand(cat):s.stage} · ${cat?sLabel(cat):s.stageLabel} <span class="pill">Token #${s.block.tokenId}</span></h4>
      ${pubs.length?pubRows:`<div class="vis">${t('(本廠無公開欄位)','(no public fields)')}</div>`}
      ${regRows}
      ${!isReg&&pris.length?`<div class="kv" style="margin-top:8px;color:var(--jewel)">🔒 ${pris.length} ${t('項加密欄位未揭露(消費者不可見;僅法規機關可審閱)','encrypted fields hidden (not shown to consumers; regulator only)')}</div>`:''}
    </div>`;
  });
  return `<h1>${t('DPP 與 QR · 數位產品護照','DPP & QR · Digital Product Passport')}</h1>
  <p>${t('消費者只看工廠選擇','Consumers see only the fields the factory marked ')}<b>${t('公開','public')}</b>${t('的欄位;','; the ')}<b>${t('法規機關','regulator')}</b>${t('另具解密權,可額外審閱工廠','has decryption rights and can additionally review the factory ')}<b>${t('加密上傳','encrypted')}</b>${t('的欄位。',' fields.')}</p>
  <div class="row"><span>${t('揭露對象:','Audience:')}</span><span class="seg">
    <button class="${aud==='consumer'?'on':''}" onclick="setAud('consumer')">${t('消費者','Consumer')}</button>
    <button class="${aud==='regulator'?'on':''}" onclick="setAud('regulator')">${t('法規機關','Regulator')}</button>
  </span><span class="right"></span><span class="vis">${t('本對象可見','Visible to this audience:')} ${visTotal} ${t('欄','fields')}(🌐 ${t('公開','public')} ${pubTotal}${isReg?` + 🔓 ${t('已解密','decrypted')} ${priApproved}${priApproved<priTotal?` · 🔒 ${t('待放行','pending')} ${priTotal-priApproved}`:''}`:` · 🔒 ${t('加密隱藏','hidden')} ${priTotal}`})</span></div>

  <div class="grid2" style="margin-top:8px;align-items:start">
    <div class="passport">
      <div class="hd"><div class="eyebrow" style="color:#cfe1ff">DIGITAL PRODUCT PASSPORT</div>
        <h3>${t(ORDER.product,ORDER.productEn)}</h3>
        <div style="opacity:.92;font-size:13px">${t('訂單','Order')} ${ORDER.no} · ${t('發行方','Issuer')} ${t(ORDER.issuer,ORDER.issuerEn)} · 🔗 ${t('已上鏈三段','3 stages on-chain')}</div></div>
      <div class="bd">
        ${body}
      </div>
    </div>
    <div>
      <div class="card" style="text-align:center">
        <h3 style="margin-top:0">📱 ${t('護照 QR','Passport QR')}(${audLabel})</h3>
        <div class="qr"><canvas id="dppQR"></canvas></div>
        <div class="kv" id="qrUrl" style="margin-top:10px;word-break:break-all">${url}</div>
        <div class="vis">${t('掃描可開啟對應對象的護照檢視','Scan to open the passport view for this audience')}</div>
      </div>
      <div class="card">
        <div class="kv">${t('DPP 雜湊','DPP hash')}:${dh}</div>
        <div class="kv">${t('溯源鏈','Trace chain')}:${ch.map(s=>{const c=stageById(s.stage);return c?sLabel(c):s.stageLabel;}).join(' → ')} → DPP</div>
        <div class="kv" style="color:var(--good)">🟢 ${t('三段皆已上鏈 · 可密碼學查驗','All 3 stages on-chain · cryptographically verifiable')}</div>
        <div class="row" style="margin-top:8px"><button class="btn" onclick="go('chain')">${t('看區塊鏈','View blockchain')} →</button><button class="btn ghost" onclick="showDppJson()">DPP JSON ▾</button></div>
      </div>
    </div>
  </div>
  <div class="callout jewel"><div class="t">🔒 ${t('選擇性揭露','Selective disclosure')}</div>${t('消費者只見工廠公開的明文欄位;加密欄位對其不揭露。','Consumers see only the public plaintext fields; encrypted fields are not disclosed to them. The ')}<b>${t('法規機關','regulator')}</b>${t('具解密權,可額外審閱工廠加密上傳的欄位(🔓)。',' has decryption rights and can additionally review the factory encrypted fields (🔓).')}</div>`;
}

function vKeys(){
  const ch=subs();
  const enc=[];
  ch.forEach(s=>s.fields.filter(f=>f.disclosure==='private').forEach(f=>enc.push({stage:s.stage,stageLabel:s.stageLabel,label:f.label,labelEn:f.labelEn,key:f.key,cipher:f.cipher})));
  const reqs=Bus.get('keyRequests')||[];
  return `<h1>${t('金鑰 / 驗證請求','Keys / Verify Requests')}</h1>
  <p>${t('平台手上每個工廠的密文都「打不開」。要查驗加密欄位,必須','Every factory ciphertext held by the platform is unopenable. To audit an encrypted field you must ')}<b>${t('向該工廠申請鑰匙','request the key from that factory')}</b>${t(',由工廠在其端點放行。',', which the factory releases at its endpoint.')}</p>
  ${enc.length?`<h2>${t('鏈上的加密欄位','Encrypted fields on chain')}(${enc.length})</h2>
  <table class="ftable"><tr><th>${t('階段','Stage')}</th><th>${t('欄位','Field')}</th><th>${t('密文(平台所見)','Ciphertext (platform view)')}</th><th></th></tr>
    ${enc.map(e=>{const r=reqs.find(x=>x.stage===e.stage&&x.key===e.key); const st=r&&r.status; let cell;
      if(st==='approved') cell=`<span class="chip">✅ ${t('工廠已放行','Factory released')}</span>`;
      else if(st==='denied') cell=`<span class="chip warn">⛔ ${t('工廠已拒絕','Factory denied')}</span> <button class="btn ghost" onclick="requestKey('${e.stage}','${e.key}')">${t('重新申請','Request again')}</button>`;
      else if(st==='pending') cell=`<span class="chip demo">⏳ ${t('已申請 · 待工廠放行','Requested · awaiting release')}</span>`;
      else cell=`<button class="btn" onclick="requestKey('${e.stage}','${e.key}')">${t('向工廠申請鑰匙','Request key')}</button>`;
      const stg=stageById(e.stage);
      return `<tr><td>${stg?sLabel(stg):e.stageLabel}</td><td>🔒 ${t(e.label,e.labelEn||e.label)}</td><td class="fval">${e.cipher||'ENC(••••)'}</td>
      <td>${cell}</td></tr>`;}).join('')}
  </table>`:`<div class="callout info">${t('目前鏈上沒有加密欄位,或尚無提交。','No encrypted fields on chain yet, or no submissions.')}</div>`}
  <div class="callout key"><div class="t">🛈 ${t('對應工作流②','Workflow ②')}</div>${t('「ALL 資料都會送回平台,但只有公開欄位是明文;其餘是密文,需經工廠同意取得鑰匙才能驗證。」工廠在其「驗證請求」頁放行後,智能合約 / TEE 才會釋放該欄位的解密能力。','All data returns to the platform, but only public fields are plaintext; the rest is ciphertext and needs the factory consent to obtain the key before it can be verified. After the factory releases it on its Verify Requests page, the smart contract / TEE unlocks decryption for that field.')}</div>`;
}

/* 把「某一站」的選定特徵累加進政策並寫出(逐站派發,而非一次三廠) */
function addStageToPolicy(stageId){
  const p = state.policy || { id:'POL-A2207', order:ORDER.no, issuer:ORDER.issuer,
    retentionYears:state.retention, deadline:ORDER.deadline, sig:'verified ✓', perStage:{} };
  p.retentionYears=state.retention;
  p.perStage = Object.assign({}, p.perStage, { [stageId]: state.sel[stageId].slice() });
  Bus.set('policy',p); state.policy=p;
  return p;
}
function dispatchPolicy(stageId){
  const stage=stageById(stageId);
  addStageToPolicy(stageId);
  logEvent(t('已派發收集政策給','Dispatched policy to')+' '+sLabel(stage)+' '+t('(序列第','(stage')+' '+(stage.order+1)+t(' 站)',')'));
  toast('🛰 '+t('已派發政策給','Dispatched to')+' '+sLabel(stage)+' · '+t('等其回傳上鏈後再設定下一站','configure the next stage after it returns and is minted'));
  render();
}

/* ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   BLOCKCHAIN INTEGRATION POINT
   工廠端只送回「簽署 + 加密邊界」(submission.block === null)。
   平台在「收到提交時」執行區塊鏈上鏈(mint / 錨定),產生 block 後回填。
   正式環境:把下面的模擬雜湊改成實際的智能合約呼叫(如 ERC-721 mint),
   等交易確認後,用回執(tokenId / txHash / blockNumber)填入 block 再寫回。
   串接規則:hash = H(index | stage | metadataHash | prevHash),prevHash 指向前一段。
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */
function mintBlock(sub){
  const stage=stageById(sub.stage);
  const prevSub=stage&&stage.prev?getSub(stage.prev):null;
  const prevHash=prevSub&&prevSub.block?prevSub.block.hash:null;
  const metadataHash=sub.metadataHash||simpleHash(JSON.stringify(sub.fields)+sub.stage);
  const hash=simpleHash(stage.order+'|'+sub.stage+'|'+metadataHash+'|'+(prevHash||''));
  return { index:stage.order, stage:sub.stage, label:stage.label, factoryId:stage.factoryId,
    tokenId:1000+parseInt(hash.slice(0,3),16),
    txHash:'0x'+simpleHash(hash+'tx')+'…'+hash.slice(0,2),
    timestamp:nowUTC(), metadataHash, prevHash, hash, real:false };
}

/* ===================== 真實上鏈:IPFS 上傳 + Sepolia mintDPP(沿用 DPP_NFT 方法) ===================== */
const MINT_STEPS=[['連接錢包 / Sepolia','Connect wallet / Sepolia'],['建立 metadata 並計算 keccak256','Build metadata & compute keccak256'],['上傳 metadata 至 IPFS(Pinata)','Upload metadata to IPFS (Pinata)'],['送出 mintDPP 交易','Send mintDPP transaction'],['等待 Sepolia 確認','Await Sepolia confirmation']];
function renderMintModal(p){
  const rows=MINT_STEPS.map((s,i)=>{
    const done=p.done||i<p.step, cur=i===p.step;
    const mark=done?'✓':(cur?(p.error?'✗':'◷'):(i+1));
    return `<li class="${done?'done':(cur?'cur':'')}"><span class="dot">${mark}</span>${t(s[0],s[1])}</li>`;
  }).join('');
  let foot;
  if(p.error){ foot=`<div class="callout warn"><div class="t">⚠ ${t('失敗','Failed')}</div>${p.error}</div><div class="row"><span class="right"></span><button class="btn" onclick="closeModal()">${t('關閉','Close')}</button></div>`; }
  else if(p.done){ foot=`<div class="callout key"><div class="t">✅ ${t('已上鏈','On-chain')}</div>Token #${p.tokenId}${p.txHash?` · <a href="https://sepolia.etherscan.io/tx/${p.txHash}" target="_blank" rel="noopener">Etherscan ↗</a>`:''}</div><div class="row"><span class="right"></span><button class="btn pri" onclick="closeModal()">${t('完成','Done')}</button></div>`; }
  else { foot=`<div class="callout info"><div class="t">⏳ ${t('進行中','In progress')}</div>${p.message||''}</div>`; }
  openModal(`<h3>🪙 ${t('鑄造','Mint')} ${p.stageLabel} DPP NFT</h3><ul class="timeline">${rows}</ul>${foot}`);
}
async function mintStageToken(stageId){
  const stage=stageById(stageId), sub=getSub(stageId);
  if(!sub){ toast(t('找不到該廠提交','Factory submission not found')); return; }
  if(sub.block){ toast(t('該廠已鑄造 Token #','Already minted Token #')+sub.block.tokenId); return; }
  const p={stageLabel:sLabel(stage), step:0, message:t('正在連接錢包並確認 Sepolia…','Connecting wallet and confirming Sepolia…'), error:null, done:false};
  renderMintModal(p);
  try{
    if(typeof ethers==='undefined') throw new Error(t('ethers.js 載入失敗(離線?)。可改用「🧪 模擬上鏈」。','ethers.js failed to load (offline?). Use 🧪 Simulate instead.'));
    if(!window.ethereum) throw new Error(t('找不到 EVM 瀏覽器錢包。請安裝 MetaMask,或改用「🧪 模擬上鏈」。','No EVM browser wallet found. Install MetaMask, or use 🧪 Simulate.'));
    const account=walletState.account||await connectWallet();
    if(!account) throw new Error(t('尚未取得錢包帳號。請允許網站連接錢包後重試。','No wallet account. Allow the site to connect your wallet and retry.'));
    if(!isSepolia()){ const ok=await switchToSepolia(); if(!ok) throw new Error(t('目前不是 Sepolia,而且網路切換未完成。','Not on Sepolia, and the network switch did not complete.')); }

    const prevStage=stage.prev?stageById(stage.prev):null;
    const prevSub=prevStage?getSub(prevStage.id):null;
    const previousTokenId=prevSub&&prevSub.block?(Number(prevSub.block.tokenId)||0):0;

    p.step=1; p.message=t('正在建立 canonical metadata 並計算 keccak256…','Building canonical metadata and computing keccak256…'); renderMintModal(p);
    const metadata=buildStageMetadata(stage, sub, previousTokenId);
    const hashes=computeDPPHashes(metadata, stage);

    p.step=2; p.message=t('正在透過本機 backend 上傳 metadata 至 Pinata / IPFS…','Uploading metadata to Pinata / IPFS via the local backend…'); renderMintModal(p);
    const upload=await uploadMetadataToIPFS(metadata);

    if(!ethers.isAddress(CONTRACT_ADDRESS)||CONTRACT_ADDRESS===ethers.ZeroAddress) throw new Error(t('NFT 合約位址尚未設定。','NFT contract address is not set.'));
    const provider=new ethers.BrowserProvider(window.ethereum);
    const network=await provider.getNetwork();
    if(Number(network.chainId)!==SEPOLIA_CHAIN_ID) throw new Error(t('錢包目前不是 Sepolia,請切換後重試。','Wallet is not on Sepolia; switch and retry.'));
    const signer=await provider.getSigner();
    const recipient=await signer.getAddress();
    const contract=new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

    p.step=3; p.message=t('請在錢包中確認 mintDPP 交易…','Confirm the mintDPP transaction in your wallet…'); renderMintModal(p);
    const tx=await contract.mintDPP(recipient, upload.tokenURI, hashes.metadataHash, hashes.schemaHash, hashes.orderHash, hashes.stage, BigInt(previousTokenId));

    p.step=4; p.txHash=tx.hash; p.message=t('交易已送出,等待 Sepolia 確認…','Transaction sent, awaiting Sepolia confirmation…'); renderMintModal(p);
    const receipt=await tx.wait();
    let tokenId=null;
    for(const log of receipt.logs){ try{ const parsed=contract.interface.parseLog(log); if(parsed?.name==='DPPMinted'){ tokenId=parsed.args.tokenId.toString(); break; } }catch(_){} }

    const block={ index:stage.order, stage:stage.id, label:stage.label, factoryId:stage.factoryId,
      tokenId: tokenId||'?', txHash:tx.hash, tokenURI:upload.tokenURI, cid:upload.cid, gatewayURL:upload.gatewayURL,
      metadataHash:hashes.metadataHash, prevTokenId:previousTokenId, timestamp:nowUTC(), issuer:recipient, real:true };
    Bus.set('submission:'+stage.id, Object.assign({}, sub, { block, metadata, canonicalJson:hashes.canonicalJson }));
    logEvent(sLabel(stage)+' → '+t('平台已鑄造 DPP NFT','platform minted DPP NFT')+' · Token #'+block.tokenId);
    p.done=true; p.tokenId=block.tokenId; renderMintModal(p);
    toast('⛓ '+sLabel(stage)+' '+t('已上鏈','on-chain')+' · Token #'+block.tokenId);
    render();
  }catch(error){
    console.error('mintStageToken failed:',error);
    p.error=walletErrorMessage(error,t('Mint 失敗,請查看瀏覽器 console。','Mint failed; see the browser console.')); renderMintModal(p);
    toast(p.error);
  }
}
/* 離線備援:用模擬區塊完成同一流程(無需 backend / 錢包) */
function simulateMintStage(stageId){
  const stage=stageById(stageId), sub=getSub(stageId);
  if(!sub||sub.block){ render(); return; }
  const block=mintBlock(sub);
  Bus.set('submission:'+stage.id, Object.assign({}, sub, { block }));
  logEvent(sLabel(stage)+' → '+t('(模擬)平台上鏈','(simulated) platform minted')+' · Token #'+block.tokenId);
  toast('🧪 '+t('(模擬)已為','(simulated) minted')+' '+sLabel(stage)+' · Token #'+block.tokenId);
  render();
}

function verifyChain(){
  const ch=minted(); let ok=true; const blocks=[];
  for(let i=0;i<ch.length;i++){
    const b=ch[i].block;
    if(b.real){ blocks.push({ok:true,real:true}); continue; }   // 真實塊由 Etherscan 驗證
    const recomputed=simpleHash(b.index+'|'+b.stage+'|'+b.metadataHash+'|'+(b.prevHash||''));
    const hashOk=recomputed===b.hash;
    const prev=i>0?ch[i-1].block:null;
    const linkOk = i===0 ? (b.prevHash===null||b.prevHash===undefined) : (prev&&!prev.real ? b.prevHash===prev.hash : true);
    const bok=hashOk&&linkOk; if(!bok)ok=false;
    blocks.push({ok:bok,hashOk,linkOk});
  }
  state.verifyResult={ok,blocks};
  toast(ok?t('🟢 驗證通過:模擬塊雜湊與鏈接一致','🟢 Verified: simulated block hashes and links are consistent'):t('🔴 發現異常:有模擬塊雜湊或鏈接對不上','🔴 Anomaly: a simulated block hash or link does not match'));
  render();
}
function setAud(a){state.audience=a;render();}
function requestKey(stage,key){
  const reqs=Bus.get('keyRequests')||[];
  let r=reqs.find(x=>x.stage===stage&&x.key===key);
  if(r){ r.status='pending'; r.ts=nowUTC(); delete r.decidedTs; } else { reqs.push({stage,key,from:'platform',status:'pending',ts:nowUTC()}); }
  Bus.set('keyRequests',reqs);
  logEvent(t('向','Requested decryption key')+' '+(stageById(stage)?sLabel(stageById(stage)):stage)+' '+t('廠 申請「','for field ')+key+t('」解密鑰匙','',));
  toast(t('已送出鑰匙申請 · 需該工廠在其「驗證請求」頁放行','Key request sent · the factory must release it on its Verify Requests page'));
  render();
}
function refreshAll(){ state.policy=Bus.get('policy'); state.verifyResult=null; toast(t('已重新讀取收集狀態','Reloaded collection status')); render(); }
function resetAll(){
  openModal(`<h3>${t('重置整批 Demo?','Reset entire Demo?')}</h3><p>${t('會清空已派發政策與三廠提交','Clears the dispatched policy and all three factory submissions')}(<code>dpp_demo:*</code>)${t(',回到初始狀態。',', returning to the initial state.')}</p>
    <div class="row"><span class="right"></span><button class="btn" onclick="closeModal()">${t('取消','Cancel')}</button>
    <button class="btn warn" onclick="doReset()">${t('確認重置','Confirm reset')}</button></div>`);
}
function doReset(){
  ['policy','submission:spin','submission:weave','submission:dye','keyRequests','events'].forEach(k=>Bus.del(k));
  Bus.set('reset',{ts:Date.now()}); // 通知工廠端清掉已送狀態
  state.policy=null; state.verifyResult=null; state.events=[]; state.unseen=0;
  closeModal(); toast(t('已重置整批 Demo','Entire Demo reset')); go('home');
}
function showDppJson(){
  const ch=minted(); const dpp={ order:ORDER.no, product:ORDER.product, issuer:ORDER.issuer, dppHash:dppHashOf(ch),
    chain:ch.map(s=>({stage:s.stage,token:s.block.tokenId,real:!!s.block.real,tokenURI:s.block.tokenURI||null,hash:s.block.hash||s.block.metadataHash,prev:s.block.prevTokenId??s.block.prevHash??null})),
    public:{} };
  ch.forEach(s=>{ dpp.public[s.stage]={}; s.fields.filter(f=>f.disclosure==='public').forEach(f=>dpp.public[s.stage][f.key]=f.val); });
  openModal(`<h3>${t('DPP JSON(只含明文)','DPP JSON (public only)')}</h3><pre class="code">${JSON.stringify(dpp,null,2).replace(/</g,'&lt;')}</pre><div class="row"><span class="right"></span><button class="btn" onclick="closeModal()">${t('關閉','Close')}</button></div>`);
}

/* ---------- modal / toast ---------- */
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function toast(msg){
  const d=document.createElement('div'); d.textContent=msg;
  d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#20211c;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw';
  document.body.appendChild(d); setTimeout(()=>d.remove(),2800);
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

/* ---------- 跨檔事件:工廠上傳時即時反應 ---------- */
Bus.onChange((key,val)=>{
  if(key.indexOf('submission:')===0 && val){
    const st=stageById(val.stage);
    if(!val.block){
      /* === BLOCKCHAIN INTEGRATION POINT ===
         工廠剛回傳原始提交(尚未上鏈)。平台「不」自動上鏈,而是在收集進度顯示
         「🪙 Mint NFT」按鈕,由平台操作員手動鑄造(真實上鏈或模擬上鏈)。 */
      logEvent((st?sLabel(st):val.stage)+' '+t('已上傳 · 待平台鑄造 NFT','uploaded · awaiting platform mint'));
      toast('📥 '+t('收到','Received')+' '+(st?sLabel(st):val.stage)+' '+t('提交 · 請至收集進度鑄造 NFT','submission · go to Collection to mint'));
      if(state.view!=='collect' && state.view!=='policy') state.unseen++;
      render();
      return;
    }
    /* 已含 block(例如模擬上鏈於另一分頁完成) */
    if(state.view!=='collect') state.unseen++;
    logEvent((st?sLabel(st):val.stage)+' '+t('已上鏈','on-chain')+' · Token #'+val.block.tokenId);
    render();
  }
  /* 工廠在其「驗證請求」頁放行/拒絕了解密鑰匙 → 反映到金鑰頁與法規視角 */
  if(key==='keyRequests'){ toast(t('🔑 工廠已更新驗證請求放行狀態','🔑 Factory updated verify-request status')); render(); }
  /* 另一分頁切換語言 → 本頁同步重繪 */
  if(key==='lang'){ render(); }
});

render();
</script>
