<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雲端平台 · DPP 發行 · 互動原型</title>
<style>
  :root{
    --paper:#f6f3ec; --surface:#fff; --surface2:#fbfaf6; --ink:#20211c; --soft:#44463e;
    --muted:#76776d; --line:#e4dfd2; --lineSoft:#efeadd;
    --accent:#1d4ed8; --accentD:#1e40af; --teal:#0d9488;
    --good:#15803d; --goodBg:#eaf5ec; --warn:#b45309; --warnBg:#fbf1e3;
    --jewel:#9333ea; --jewelBg:#f4ecfb; --info:#eef0fb;
    --radius:13px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(40,38,30,.06);
    --font:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:3px solid var(--accent)}
  .topbar .brand{font-weight:800;font-size:15px}
  .topbar .role{font-size:13px;color:var(--muted)}
  .topbar .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;
    padding:3px 10px;background:var(--goodBg);color:var(--good);border:1px solid #cfe6d4}
  .chip.demo{background:var(--info);color:var(--accent);border-color:#d9ddf6}
  .chip.warn{background:var(--warnBg);color:var(--warn);border-color:#f0dcc0}
  .layout{display:flex;align-items:flex-start}
  .side{width:236px;flex:none;border-right:1px solid var(--line);background:var(--surface2);
    min-height:calc(100vh - 56px);position:sticky;top:56px;padding:12px 10px}
  .nav a{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:10px;text-decoration:none;
    color:var(--soft);font-size:14px;cursor:pointer;margin:2px 0}
  .nav a:hover{background:var(--lineSoft);color:var(--ink)}
  .nav a.on{background:var(--accent);color:#fff}
  .nav a .b{margin-left:auto;font-size:11px;font-weight:700;background:#dc2626;color:#fff;border-radius:999px;padding:1px 7px;
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 5px rgba(220,38,38,0)}}
  .nav a.on .b{background:rgba(255,255,255,.3);animation:none}
  .nav .grp{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:12px 12px 4px}
  main{flex:1;min-width:0;padding:24px 30px 80px;max-width:1040px}
  h1{font-size:24px;margin:4px 0 4px}
  h2{font-size:18px;margin:26px 0 8px}
  h3{font-size:15.5px;margin:18px 0 6px}
  p{color:var(--soft);margin:8px 0}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  code{font-family:var(--mono);font-size:.86em;background:var(--lineSoft);padding:1px 6px;border-radius:5px;color:#5b4636}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin:12px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
  .callout{border-radius:11px;padding:12px 15px;margin:12px 0;font-size:13.5px;border:1px solid var(--line);background:var(--surface2)}
  .callout .t{font-weight:700;font-size:12.5px;margin-bottom:3px;display:flex;gap:6px;align-items:center}
  .callout.key{background:var(--goodBg);border-color:#cfe6d4}.callout.key .t{color:var(--good)}
  .callout.warn{background:var(--warnBg);border-color:#f0dcc0}.callout.warn .t{color:var(--warn)}
  .callout.info{background:var(--info);border-color:#d9ddf6}.callout.info .t{color:var(--accent)}
  .callout.jewel{background:var(--jewelBg);border-color:#e6d3f6}.callout.jewel .t{color:var(--jewel)}
  .pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--lineSoft);color:var(--soft);font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font)}
  .btn:hover{border-color:#cfc8b6}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.pri:hover{background:var(--accentD)}
  .btn.ghost{background:transparent}
  .btn.warn{color:var(--warn);border-color:#f0dcc0;background:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .right{margin-left:auto}
  .steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 18px;font-size:12.5px}
  .steps .s{padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
  .steps .s.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .steps .s.done{background:var(--goodBg);color:var(--good);border-color:#cfe6d4}
  .steps .ar{color:var(--muted)}
  .ftable{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-top:8px}
  .ftable th{font-size:12px;text-align:left;color:var(--muted);background:var(--surface2);padding:9px 12px;font-weight:700}
  .ftable td{padding:10px 12px;border-top:1px solid var(--lineSoft);vertical-align:middle;font-size:14px}
  .grphead td{background:var(--surface2);font-weight:700;font-size:12.5px;color:var(--soft);padding:7px 12px}
  .fval{font-family:var(--mono);font-size:12.5px;color:var(--soft)}
  .vis{font-size:11px;color:var(--muted)}
  .summary{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;margin:10px 0}
  .summary .big{font-size:20px;font-weight:800}
  .bdcol{border-radius:12px;padding:14px 16px;margin:10px 0;border:1px solid var(--line)}
  .bdcol.pub{background:var(--goodBg);border-color:#cfe6d4}
  .bdcol.pri{background:var(--jewelBg);border-color:#e6d3f6}
  .bdcol.att{background:var(--surface2)}
  .bdcol h4{margin:0 0 8px;font-size:14.5px}
  .kv{font-family:var(--mono);font-size:12.5px;color:var(--soft);margin:3px 0}
  .bar{height:9px;background:var(--lineSoft);border-radius:999px;overflow:hidden;margin:8px 0}
  .bar>i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}
  pre.code{background:#1f1d29;color:#e7e3f5;border-radius:10px;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
  .timeline{list-style:none;padding:0;margin:8px 0}
  .timeline li{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px}
  .timeline .dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--lineSoft);color:var(--muted)}
  .timeline li.done .dot{background:var(--goodBg);color:var(--good)}
  .timeline li.cur .dot{background:var(--accent);color:#fff}
  .scbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:13px;margin:8px 0}
  .scbar .st{padding:4px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
  .scbar .st.done{background:var(--goodBg);color:var(--good);border-color:#cfe6d4}
  .scbar .st.cur{background:var(--info);color:var(--accent);border-color:#d9ddf6;font-weight:700}
  .blk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow);margin:10px 0;position:relative}
  .blk .ix{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-right:8px}
  .link{text-align:center;color:var(--muted);font-size:18px;margin:-2px 0}
  /* DPP / QR */
  .passport{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
  .passport .hd{background:linear-gradient(120deg,#1d4ed8,#0d9488);color:#fff;padding:18px 20px}
  .passport .hd h3{margin:0;font-size:18px;color:#fff}
  .passport .bd{padding:16px 20px}
  .qr{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
  .qr canvas{display:block;image-rendering:pixelated}
  .attr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--lineSoft);font-size:13.5px}
  .attr:first-child{border-top:0}
  .attr .a-l{color:var(--soft)} .attr .a-v{font-family:var(--mono);color:var(--ink);text-align:right}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .seg button{border:0;background:transparent;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);font-family:var(--font)}
  .seg button.on{background:var(--accent);color:#fff}
  .mask{position:fixed;inset:0;background:rgba(30,28,22,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal{background:var(--surface);border-radius:16px;max-width:460px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 8px}
  .hidden{display:none}
  select{font-family:var(--font);font-size:13.5px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
  @media(max-width:720px){
    .layout{flex-direction:column}
    .side{width:100%;min-height:0;position:static;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto}
    .nav{display:flex;gap:4px}.nav .grp{display:none}.nav a{white-space:nowrap;margin:0}
    main{padding:18px}
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand" style="display:inline-flex;align-items:center;gap:9px">
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kanesh">
      <rect width="32" height="32" rx="8" fill="url(#kaneshG)"/>
      <path d="M11 7v18M11 16l8.5-9M11 16l8.5 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <defs><linearGradient id="kaneshG" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs>
    </svg>
    <span>KANESH <span style="font-weight:600;color:var(--muted)">· 雲端平台</span></span>
  </span>
  <span class="role">· DPP 發行方 · 訂單 <code>#A2207</code></span>
  <span class="spacer"></span>
  <span class="chip" id="connChip">🛰 收集中</span>
  <span class="chip">🔏 簽章金鑰就緒</span>
  <span class="chip demo">原型 Demo</span>
</div>

<div class="layout">
  <aside class="side"><nav class="nav" id="nav"></nav></aside>
  <main id="main"></main>
</div>

<div id="modal" class="mask hidden"><div class="modal" id="modalBody"></div></div>

};
function simpleHash(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*0x01000193)>>>0;}return ('00000000'+h.toString(16)).slice(-8);}

/* ---------- QR 包裝(已用 cv2 驗證可掃描) ---------- */
const QR={ render(canvas,text,opts){ opts=opts||{}; try{
    const qr=qrcode(0,opts.ec||'M'); qr.addData(text); qr.make();
    const n=qr.getModuleCount(), scale=opts.scale||6, m=opts.margin==null?4:opts.margin, size=(n+m*2)*scale;
    canvas.width=size; canvas.height=size; const x=canvas.getContext('2d');
    x.fillStyle='#ffffff'; x.fillRect(0,0,size,size); x.fillStyle='#111111';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(qr.isDark(r,c)) x.fillRect((c+m)*scale,(r+m)*scale,scale,scale);
    return true;
  }catch(e){ return false; } } };

  {key:'greigeBatch',grp:'批次 / 料號',label:'胚布批號 greige',val:'G-2207-08',sensitive:false,rec:'public'},

/* ===================== DPP metadata / 雜湊 / IPFS(沿用 DPP_NFT 方法) ===================== */
function stableStringify(value){
  if(Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
  if(value!==null && typeof value==='object'){
    return `{${Object.keys(value).sort().map(k=>`${JSON.stringify(k)}:${stableStringify(value[k])}`).join(',')}}`;
  }
  return JSON.stringify(value);
}
/* 由「工廠回傳的提交」組出 DPP metadata JSON(公開欄位明文,加密欄位放 demo 佔位) */
function buildStageMetadata(stage, sub, previousTokenId){
  const publicData={}, encryptedData={};
  const attributes=(sub.fields||[]).map(f=>{
    if(f.disclosure==='public'){ publicData[f.key]=f.val; return {trait_type:f.label,value:f.val,visibility:'public'}; }
    encryptedData[f.key]=`ENC(DEMO_ONLY:${f.key})`;
    return {trait_type:f.label,value:'Encrypted (demo placeholder)',visibility:'private'};
  });
  return {
    name:`Kanesh DPP ${ORDER.no} · ${stage.label}`,
    description:`Platform-issued Digital Product Passport for the ${stage.label} stage of order ${ORDER.no}.`,
    attributes,
    dpp:{
      schema:stage.schema, order:ORDER.no, stage:stage.id,
      previousTokenId:previousTokenId||0, factoryDid:stage.factoryDid,
      publicData, encryptedData, encryptionNotice:'DEMO_ONLY_NOT_REAL_ENCRYPTION'
    }
  };
}
function computeDPPHashes(metadata, stage){

    canonicalJson,
    metadataHash:ethers.keccak256(ethers.toUtf8Bytes(canonicalJson)),
    schemaHash:ethers.keccak256(ethers.toUtf8Bytes(stage.schema)),
    orderHash:ethers.keccak256(ethers.toUtf8Bytes(ORDER.no)),
    stage:ethers.keccak256(ethers.toUtf8Bytes(stage.id))
  };
}
async function uploadMetadataToIPFS(metadata){
  let response;
  try{
    response=await fetch(IPFS_UPLOAD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(metadata)});
  }catch(e){
    throw new Error(`無法連接本機 IPFS 上傳服務 (${IPFS_UPLOAD_ENDPOINT})。請先在 DPP_NFT 執行 npm start。`);
  }
  let result=null; try{result=await response.json();}catch(_){}
  if(!response.ok) throw new Error(result?.error||`IPFS 上傳失敗 (HTTP ${response.status})。`);
  if(!result?.cid || !result?.tokenURI) throw new Error('IPFS 上傳服務未回傳有效的 CID / tokenURI。');
  return {cid:result.cid, tokenURI:result.tokenURI, gatewayURL:result.gatewayURL||null};
}

const walletState={account:null, chainId:null};
function isSepolia(){return walletState.chainId===SEPOLIA_CHAIN_ID;}
function walletErrorMessage(error, fallback){
  const m=error&&(error.info?.error?.message||error.shortMessage||error.message);
  return m?`${fallback}(${m})`:fallback;
}
async function connectWallet(){
  if(!window.ethereum){ const m='找不到 EVM 瀏覽器錢包。請安裝或啟用 MetaMask / OKX Wallet 後重試。'; alert(m); toast(m); return null; }
  try{
    const accounts=await window.ethereum.request({method:'eth_requestAccounts'});
    walletState.account=accounts?.[0]||null;
    const cid=await window.ethereum.request({method:'eth_chainId'});
    walletState.chainId=parseInt(cid,16);
    return walletState.account;
  }catch(error){ toast(walletErrorMessage(error,'錢包連線失敗。')); return null; }
}
async function switchToSepolia(){
  if(!window.ethereum) return false;
  try{
    await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:SEPOLIA_CHAIN_HEX}]});

    walletState.chainId=parseInt(cid,16);

  }catch(error){ toast(walletErrorMessage(error,'無法切換到 Sepolia,請在錢包中手動切換後重試。')); return false; }

function dppHashOf(ch){ return simpleHash(ch.map(s=>s.block.hash||s.block.metadataHash).join('|')+ch.map(s=>s.fields.filter(f=>f.disclosure==='public').map(f=>f.val).join(',')).join('|')); }

  let pubTotal=0, priTotal=0;
  ch.forEach(s=>{pubTotal+=s.publicCount; priTotal+=s.privateCount;});

  const aud=state.audience;

    const pubRows=pubs.map(f=>`<div class="attr"><span class="a-l">🌐 ${f.label}</span><span class="a-v">${f.val}</span></div>`).join('');

    body+=`<div class="bdcol pub"><h4>${cat?cat.brand:s.stage} · ${s.stageLabel} <span class="pill">Token #${s.block.tokenId}</span></h4>
      ${pubs.length?pubRows:'<div class="vis">(本廠無公開欄位)</div>'}

/* ---------- 互動 ---------- */
function toggleSel(stage,key){

/* 把「某一站」的選定特徵累加進政策並寫出(逐站派發,而非一次三廠) */
function addStageToPolicy(stageId){
  const p = state.policy || { id:'POL-A2207', order:ORDER.no, issuer:ORDER.issuer,
    retentionYears:state.retention, deadline:ORDER.deadline, sig:'verified ✓', perStage:{} };
  p.retentionYears=state.retention;
  p.perStage = Object.assign({}, p.perStage, { [stageId]: state.sel[stageId].slice() });
  Bus.set('policy',p); state.policy=p;
  return p;
}
function dispatchPolicy(stageId){
  const stage=stageById(stageId);
  addStageToPolicy(stageId);
  logEvent('已派發收集政策給 '+stage.label+'廠(序列第 '+(stage.order+1)+' 站)');
  toast('🛰 已派發政策給 '+stage.label+'廠 · 等其回傳上鏈後再設定下一站');
  render();
}

/* ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   BLOCKCHAIN INTEGRATION POINT
   工廠端只送回「簽署 + 加密邊界」(submission.block === null)。
   平台在「收到提交時」執行區塊鏈上鏈(mint / 錨定),產生 block 後回填。
   正式環境:把下面的模擬雜湊改成實際的智能合約呼叫(如 ERC-721 mint),
   等交易確認後,用回執(tokenId / txHash / blockNumber)填入 block 再寫回。
   串接規則:hash = H(index | stage | metadataHash | prevHash),prevHash 指向前一段。
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */
function mintBlock(sub){
  const stage=stageById(sub.stage);
  const prevSub=stage&&stage.prev?getSub(stage.prev):null;
  const prevHash=prevSub&&prevSub.block?prevSub.block.hash:null;
  const metadataHash=sub.metadataHash||simpleHash(JSON.stringify(sub.fields)+sub.stage);
  const hash=simpleHash(stage.order+'|'+sub.stage+'|'+metadataHash+'|'+(prevHash||''));
  return { index:stage.order, stage:sub.stage, label:stage.label, factoryId:stage.factoryId,
    tokenId:1000+parseInt(hash.slice(0,3),16),
    txHash:'0x'+simpleHash(hash+'tx')+'…'+hash.slice(0,2),
    timestamp:nowUTC(), metadataHash, prevHash, hash, real:false };
}

/* ===================== 真實上鏈:IPFS 上傳 + Sepolia mintDPP(沿用 DPP_NFT 方法) ===================== */
const MINT_STEPS=['連接錢包 / Sepolia','建立 metadata 並計算 keccak256','上傳 metadata 至 IPFS(Pinata)','送出 mintDPP 交易','等待 Sepolia 確認'];
function renderMintModal(p){
  const rows=MINT_STEPS.map((s,i)=>{
    const done=p.done||i<p.step, cur=i===p.step;
    const mark=done?'✓':(cur?(p.error?'✗':'◷'):(i+1));
    return `<li class="${done?'done':(cur?'cur':'')}"><span class="dot">${mark}</span>${s}</li>`;
  }).join('');
  let foot;
  if(p.error){ foot=`<div class="callout warn"><div class="t">⚠ 失敗</div>${p.error}</div><div class="row"><span class="right"></span><button class="btn" onclick="closeModal()">關閉</button></div>`; }
  else if(p.done){ foot=`<div class="callout key"><div class="t">✅ 已上鏈</div>Token #${p.tokenId}${p.txHash?` · <a href="https://sepolia.etherscan.io/tx/${p.txHash}" target="_blank" rel="noopener">Etherscan ↗</a>`:''}</div><div class="row"><span class="right"></span><button class="btn pri" onclick="closeModal()">完成</button></div>`; }
  else { foot=`<div class="callout info"><div class="t">⏳ 進行中</div>${p.message||''}</div>`; }
  openModal(`<h3>🪙 鑄造 ${p.stageLabel} DPP NFT</h3><ul class="timeline">${rows}</ul>${foot}`);
}
async function mintStageToken(stageId){
  const stage=stageById(stageId), sub=getSub(stageId);
  if(!sub){ toast('找不到該廠提交'); return; }
  if(sub.block){ toast('該廠已鑄造 Token #'+sub.block.tokenId); return; }
  const p={stageLabel:stage.label, step:0, message:'正在連接錢包並確認 Sepolia…', error:null, done:false};
  renderMintModal(p);
  try{
    if(typeof ethers==='undefined') throw new Error('ethers.js 載入失敗(離線?)。可改用「🧪 模擬上鏈」。');
    if(!window.ethereum) throw new Error('找不到 EVM 瀏覽器錢包。請安裝 MetaMask,或改用「🧪 模擬上鏈」。');
    const account=walletState.account||await connectWallet();
    if(!account) throw new Error('尚未取得錢包帳號。請允許網站連接錢包後重試。');
    if(!isSepolia()){ const ok=await switchToSepolia(); if(!ok) throw new Error('目前不是 Sepolia,而且網路切換未完成。'); }

    const prevStage=stage.prev?stageById(stage.prev):null;
    const prevSub=prevStage?getSub(prevStage.id):null;
    const previousTokenId=prevSub&&prevSub.block?(Number(prevSub.block.tokenId)||0):0;

    p.step=1; p.message='正在建立 canonical metadata 並計算 keccak256…'; renderMintModal(p);
    const metadata=buildStageMetadata(stage, sub, previousTokenId);
    const hashes=computeDPPHashes(metadata, stage);

    p.step=2; p.message='正在透過本機 backend 上傳 metadata 至 Pinata / IPFS…'; renderMintModal(p);
    const upload=await uploadMetadataToIPFS(metadata);

    if(!ethers.isAddress(CONTRACT_ADDRESS)||CONTRACT_ADDRESS===ethers.ZeroAddress) throw new Error('NFT 合約位址尚未設定。');
    const provider=new ethers.BrowserProvider(window.ethereum);
    const network=await provider.getNetwork();
    if(Number(network.chainId)!==SEPOLIA_CHAIN_ID) throw new Error('錢包目前不是 Sepolia,請切換後重試。');
    const signer=await provider.getSigner();
    const recipient=await signer.getAddress();
    const contract=new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

    p.step=3; p.message='請在錢包中確認 mintDPP 交易…'; renderMintModal(p);
    const tx=await contract.mintDPP(recipient, upload.tokenURI, hashes.metadataHash, hashes.schemaHash, hashes.orderHash, hashes.stage, BigInt(previousTokenId));

    p.step=4; p.txHash=tx.hash; p.message='交易已送出,等待 Sepolia 確認…'; renderMintModal(p);
    const receipt=await tx.wait();
    let tokenId=null;
    for(const log of receipt.logs){ try{ const parsed=contract.interface.parseLog(log); if(parsed?.name==='DPPMinted'){ tokenId=parsed.args.tokenId.toString(); break; } }catch(_){} }

    const block={ index:stage.order, stage:stage.id, label:stage.label, factoryId:stage.factoryId,
      tokenId: tokenId||'?', txHash:tx.hash, tokenURI:upload.tokenURI, cid:upload.cid, gatewayURL:upload.gatewayURL,
      metadataHash:hashes.metadataHash, prevTokenId:previousTokenId, timestamp:nowUTC(), issuer:recipient, real:true };
    Bus.set('submission:'+stage.id, Object.assign({}, sub, { block, metadata, canonicalJson:hashes.canonicalJson }));
    logEvent(stage.label+'廠 → 平台已鑄造 DPP NFT · Token #'+block.tokenId);
    p.done=true; p.tokenId=block.tokenId; renderMintModal(p);
    toast('⛓ '+stage.label+'廠 已上鏈 · Token #'+block.tokenId);
    render();
  }catch(error){
    console.error('mintStageToken failed:',error);
    p.error=walletErrorMessage(error,'Mint 失敗,請查看瀏覽器 console。'); renderMintModal(p);
    toast(p.error);
  }
}
/* 離線備援:用模擬區塊完成同一流程(無需 backend / 錢包) */
function simulateMintStage(stageId){
  const stage=stageById(stageId), sub=getSub(stageId);
  if(!sub||sub.block){ render(); return; }
  const block=mintBlock(sub);
  Bus.set('submission:'+stage.id, Object.assign({}, sub, { block }));
  logEvent(stage.label+'廠 →(模擬)平台上鏈 · Token #'+block.tokenId);
  toast('🧪(模擬)已為 '+stage.label+'廠 上鏈 · Token #'+block.tokenId);
  render();
}

function verifyChain(){
  const ch=minted(); let ok=true; const blocks=[];
  for(let i=0;i<ch.length;i++){
    const b=ch[i].block;
    if(b.real){ blocks.push({ok:true,real:true}); continue; }   // 真實塊由 Etherscan 驗證
    const recomputed=simpleHash(b.index+'|'+b.stage+'|'+b.metadataHash+'|'+(b.prevHash||''));
    const hashOk=recomputed===b.hash;
    const prev=i>0?ch[i-1].block:null;
    const linkOk = i===0 ? (b.prevHash===null||b.prevHash===undefined) : (prev&&!prev.real ? b.prevHash===prev.hash : true);
    const bok=hashOk&&linkOk; if(!bok)ok=false;
    blocks.push({ok:bok,hashOk,linkOk});
  }
  state.verifyResult={ok,blocks};
  toast(ok?'🟢 驗證通過:模擬塊雜湊與鏈接一致':'🔴 發現異常:有模擬塊雜湊或鏈接對不上');
  render();
}
function setAud(a){state.audience=a;render();}
function requestKey(stage,key){
  const reqs=Bus.get('keyRequests')||[];
  if(!reqs.find(r=>r.stage===stage&&r.key===key)){ reqs.push({stage,key,from:'platform',status:'pending',ts:nowUTC()}); Bus.set('keyRequests',reqs);
    logEvent('向 '+(stageById(stage)?stageById(stage).label:stage)+'廠 申請「'+key+'」解密鑰匙'); }
  toast('已送出鑰匙申請 · 需該工廠在其「驗證請求」頁放行');
  render();
}
function refreshAll(){ state.policy=Bus.get('policy'); state.verifyResult=null; toast('已重新讀取收集狀態'); render(); }
function resetAll(){
  openModal(`<h3>重置整批 Demo?</h3><p>會清空已派發政策與三廠提交(<code>dpp_demo:*</code>),回到初始狀態。</p>
    <div class="row"><span class="right"></span><button class="btn" onclick="closeModal()">取消</button>
    <button class="btn warn" onclick="doReset()">確認重置</button></div>`);
}
function doReset(){
  ['policy','submission:spin','submission:weave','submission:dye','keyRequests','events'].forEach(k=>Bus.del(k));
  Bus.set('reset',{ts:Date.now()}); // 通知工廠端清掉已送狀態
  state.policy=null; state.verifyResult=null; state.events=[]; state.unseen=0;
  closeModal(); toast('已重置整批 Demo'); go('home');
}
function showDppJson(){
  const ch=minted(); const dpp={ order:ORDER.no, product:ORDER.product, issuer:ORDER.issuer, dppHash:dppHashOf(ch),
    chain:ch.map(s=>({stage:s.stage,token:s.block.tokenId,real:!!s.block.real,tokenURI:s.block.tokenURI||null,hash:s.block.hash||s.block.metadataHash,prev:s.block.prevTokenId??s.block.prevHash??null})),
    public:{} };
  ch.forEach(s=>{ dpp.public[s.stage]={}; s.fields.filter(f=>f.disclosure==='public').forEach(f=>dpp.public[s.stage][f.key]=f.val); });
  openModal(`<h3>DPP JSON(只含明文)</h3><pre class="code">${JSON.stringify(dpp,null,2).replace(/</g,'&lt;')}</pre><div class="row"><span class="right"></span><button class="btn" onclick="closeModal()">關閉</button></div>`);
}

/* ---------- modal / toast ---------- */
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function toast(msg){
  const d=document.createElement('div'); d.textContent=msg;
  d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#20211c;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw';
  document.body.appendChild(d); setTimeout(()=>d.remove(),2800);
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

/* ---------- 跨檔事件:工廠上傳時即時反應 ---------- */
Bus.onChange((key,val)=>{
  if(key.indexOf('submission:')===0 && val){
    const st=stageById(val.stage);
    if(!val.block){
      /* === BLOCKCHAIN INTEGRATION POINT ===
         工廠剛回傳原始提交(尚未上鏈)。平台「不」自動上鏈,而是在收集進度顯示
         「🪙 Mint NFT」按鈕,由平台操作員手動鑄造(真實上鏈或模擬上鏈)。 */
      logEvent((st?st.label:val.stage)+'廠 已上傳 · 待平台鑄造 NFT');
      toast('📥 收到 '+(st?st.label:val.stage)+'廠 提交 · 請至收集進度鑄造 NFT');
      if(state.view!=='collect' && state.view!=='policy') state.unseen++;
      render();
      return;
    }
    /* 已含 block(例如模擬上鏈於另一分頁完成) */
    if(state.view!=='collect') state.unseen++;
    logEvent((st?st.label:val.stage)+'廠 已上鏈 · Token #'+val.block.tokenId);
    render();
  }
});

render();
